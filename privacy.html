<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALM — Privacy Policy / プライバシーポリシー</title>
<!--
  App Store Connect と App Store から参照される公開ページ。
  本文はアプリ内の PRIVACY_POLICY と同じものを書き出している。
  文面を直すときはアプリ側と必ず両方直すこと。
-->
<style>
  :root { --bg:#ffffff; --text:#1b1f24; --text-dim:#6b7480; --line:#e6e9ed; --accent:#e65100; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --text:#e6edf3; --text-dim:#93a0ad; --line:#252c34; --accent:#ff9d4d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",Arial,sans-serif;
         line-height:1.85; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 72px; }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
           border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:8px; }
  h1 { font-size:22px; font-weight:800; margin:0; letter-spacing:.02em; }
  .sub { font-size:12px; color:var(--text-dim); font-weight:700; }
  nav { margin-left:auto; display:flex; gap:6px; }
  nav button { border:1px solid var(--line); background:transparent; color:var(--text-dim);
               border-radius:8px; padding:5px 11px; font-size:12px; font-weight:800; cursor:pointer; }
  nav button[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  h4 { font-size:14px; margin:26px 0 6px; }
  p { margin:8px 0; font-size:14px; }
  ul { padding-left:1.2em; }
  li { font-size:14px; margin:4px 0; }
  a { color:var(--accent); }
  footer { margin-top:40px; padding-top:14px; border-top:1px solid var(--line);
           font-size:12px; color:var(--text-dim); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CALM</h1>
      <div class="sub">Cinema Advanced Lighting Matcher</div>
    </div>
    <nav>
      <button data-l="ja">日本語</button>
      <button data-l="en">English</button>
      <button data-l="es">Español</button>
    </nav>
  </header>

  <section id="body"></section>

  <footer>
    <span id="contact"></span>
  </footer>
</div>

<script>
var POLICY = {"ja": "<p style=\"color:var(--text-dim);font-size:11px;\">最終更新日: 2026年8月29日</p><p>CALM（Cinema Advanced Lighting Matcher、以下「本アプリ」）は、映画・映像撮影のための照明計算ツールです。本ポリシーは本アプリが取り扱う情報について説明します。</p><h4>1. 収集する情報</h4><p>本アプリはアカウント登録を必要とせず、氏名・住所・メールアドレス等の個人情報を収集しません。広告・行動追跡（トラッキング）・アクセス解析は一切行いません。</p><h4>2. 端末内に保存されるデータ</h4><p>設定・お気に入り・図面（Draft）・プロジェクト・言語などの利用データは、すべてお使いの端末内（ブラウザのローカルストレージ）にのみ保存されます。これらのデータが外部サーバーに送信されることはなく、開発者や第三者が閲覧することはできません。</p><h4>3. フィードバック送信（任意）</h4><p>メニューの「Feedback」から意見を送信した場合に限り、入力した内容と、動作環境の情報（アプリのバージョン・OS・端末モデル・言語）が、不具合対応の目的で開発者に送信されます。</p><p>返信をご希望の場合のみ、「返信先」の欄にメールアドレスなどをご記入いただけます。任意の項目で、空欄でも送信できます。ご記入いただいた連絡先は返信のためだけに使い、ほかの目的に使うことも、第三者に渡すこともありません。それ以外の個人情報は入力しないようお願いします。</p><h4>4. 位置情報</h4><p>SUN SCOUT で「現在地」を押したときにのみ、端末の位置情報（緯度・経度）を取得します。その日の太陽と月の位置を計算するためと、カメラに重ねて表示するときに真北を求めるために使います。位置情報は端末内でのみ使用し、外部に送信・保存されることはありません。位置情報を使わずに、緯度・経度を手で入力して使うこともできます。</p><h4>5. カメラ</h4><p>カメラは、距離の計測と、太陽・月の道すじを実景に重ねる表示のためにのみ使用します。映像は端末内で処理するだけで、保存も外部送信もしません。図面に写真を撮って取り込む場合のみ、撮影した写真が端末内に保存されます。</p><h4>6. iCloud への保存</h4><p>図面（Draft）は、お使いの Apple アカウントの iCloud Drive に保存され、同じアカウントの端末どうしで共有されます。保存先は Apple の iCloud であり、開発者のサーバーではありません。開発者がその内容を閲覧することはできません。iCloud を使いたくない場合は、端末の設定から本アプリの iCloud Drive を切ることができます。</p><h4>7. 写真・PDFの読み込み</h4><p>Draftで読み込んだ写真やPDFは端末内に保存されるだけで、外部へアップロードされません。</p><h4>8. 外部リンク</h4><p>各メーカーのDMXチャートやマニュアルのリンクを開くと外部サイトに移動します。外部サイトでの取り扱いは各社のプライバシーポリシーに従います。</p><h4>9. データの削除</h4><p>アプリを削除するか、端末のアプリデータ／サイトデータを消去することで、保存されたデータはすべて削除されます。</p><h4>10. ベータ版について</h4><p>本アプリは TestFlight による評価版（ベータ）であり、初回起動から一定期間（約3週間）で使用できなくなります。</p><h4>11. 子どもの利用</h4><p>本アプリは13歳未満の子どもを対象としていません。</p><h4>12. 本ポリシーの変更</h4><p>本ポリシーは予告なく更新されることがあります。重要な変更がある場合はアプリ内で告知します。</p><h4>13. 計算結果と数値について</h4><p>本アプリが表示する照度・F値・ビーム角などの数値は、メーカーの公表値や実測値をもとに計算したものです。現場では電源電圧・ランプの使用時間・個体差・反射・大気の状態など多くの要因が影響するため、<b>実際の計測結果とは異なる場合があります</b>。あくまで目安としてご利用いただき、最終的な判断は現場での実測によって行ってください。</p><p>また、機種や付属品によっては公表データが存在せず、近い条件から換算した値を用いている場合があります。ビーム角が確認できていないものは「角度未確認」と表示します。</p><p>本アプリの数値を用いた判断の結果について、開発者は責任を負いかねます。</p><h4>14. お問い合わせ</h4><p>本ポリシーに関するお問い合わせ: <a href=\"mailto:katohmanabu@icloud.com\">katohmanabu@icloud.com</a></p>", "en": "<p style=\"color:var(--text-dim);font-size:11px;\">Last updated: August 29, 2026</p><p>CALM (Cinema Advanced Lighting Matcher, the \"App\") is a lighting calculation tool for film and video production. This policy explains how the App handles information.</p><h4>1. Information We Collect</h4><p>The App requires no account and collects no personal information such as your name, address, or email. It contains no advertising, no behavioral tracking, and no analytics.</p><h4>2. Data Stored on Your Device</h4><p>Your settings, favorites, drafts, projects, and language are stored only on your device (browser local storage). This data is never transmitted to any server and cannot be viewed by the developer or third parties.</p><h4>3. Feedback (optional)</h4><p>Only if you submit the in-app \"Feedback\" form, the message you write together with technical details (app version, OS, device model, language) is sent to the developer to diagnose issues.</p><p>If you would like a reply, there is an optional \"Where to reply\" field for an email address. It can be left blank. Anything you put there is used only to reply to you; it is not used for anything else and is not passed to anyone. Please do not include other personal information.</p><h4>4. Location</h4><p>Your coordinates are read only when you tap “Here” in SUN SCOUT. They are used to work out the sun and moon positions for that place, and to establish true north when the paths are laid over the camera view. Your location is used on the device only; it is never transmitted or stored elsewhere. You can also type coordinates in by hand and never use location at all.</p><h4>5. Camera</h4><p>The camera is used only to measure distance and to lay the sun and moon paths over the live view. The image is processed on the device and is neither stored nor transmitted. A photo is saved on your device only when you deliberately take one to place in a floor plan.</p><h4>6. iCloud</h4><p>Floor plans (Draft) are stored in your own iCloud Drive and shared between devices signed in to the same Apple Account. They sit in Apple’s iCloud, not on a developer server, and the developer cannot see them. You can turn iCloud Drive off for this app in your device settings.</p><h4>7. Photos & PDF Import</h4><p>Photos or PDFs you import in Draft are stored on your device only and are never uploaded.</p><h4>8. External Links</h4><p>Opening a manufacturer's DMX chart or manual link takes you to an external website governed by that company's own privacy policy.</p><h4>9. Deleting Your Data</h4><p>Uninstalling the App or clearing its app/site data removes all stored data.</p><h4>10. Beta Version</h4><p>This App is a TestFlight beta and stops working a set period (about 3 weeks) after first launch.</p><h4>11. Children</h4><p>The App is not directed to children under 13.</p><h4>12. Changes</h4><p>This policy may be updated. Significant changes will be announced in the App.</p><h4>13. About the calculated figures</h4><p>The illuminance, f-stop and beam angle figures shown in this app are calculated from manufacturer-published and measured data. On set, mains voltage, lamp hours, unit-to-unit variation, reflection and atmospheric conditions all have an effect, so <b>the figures may differ from an actual meter reading</b>. Treat them as a guide and make final decisions by metering on set.</p><p>For some fixtures and accessories no published data exists, and figures derived from comparable conditions are used instead. Beam angles that could not be verified are shown as “angle unverified”.</p><p>The developer cannot accept liability for decisions made using these figures.</p><h4>14. Contact</h4><p>Questions about this policy: <a href=\"mailto:katohmanabu@icloud.com\">katohmanabu@icloud.com</a></p>", "es": "<p style=\"color:var(--text-dim);font-size:11px;\">Última actualización: 29 de agosto de 2026</p><p>CALM (Cinema Advanced Lighting Matcher, la «App») es una herramienta de cálculo de iluminación para producción de cine y vídeo. Esta política explica cómo la App trata la información.</p><h4>1. Información que recopilamos</h4><p>La App no requiere cuenta y no recopila datos personales como nombre, dirección o correo. No contiene publicidad, ni seguimiento de comportamiento, ni analíticas.</p><h4>2. Datos almacenados en tu dispositivo</h4><p>Tus ajustes, favoritos, planos (Draft), proyectos e idioma se guardan solo en tu dispositivo (almacenamiento local del navegador). Estos datos nunca se envían a ningún servidor ni pueden ser vistos por el desarrollador o terceros.</p><h4>3. Comentarios (opcional)</h4><p>Solo si envías el formulario «Feedback», el mensaje que escribes junto con datos técnicos (versión de la app, SO, modelo de dispositivo, idioma) se envía al desarrollador para diagnosticar problemas.</p><p>Si quieres una respuesta, hay un campo opcional «Dónde responder» para un correo electrónico. Puede dejarse en blanco. Lo que escribas ahí se usa solo para responderte; no se usa para nada más ni se cede a terceros. No incluyas otra información personal.</p><h4>4. Ubicación</h4><p>Tus coordenadas se leen únicamente cuando pulsas “Aquí” en SUN SCOUT. Se usan para calcular la posición del sol y de la luna en ese lugar, y para determinar el norte verdadero al superponer las trayectorias sobre la cámara. La ubicación se usa solo en el dispositivo; nunca se transmite ni se guarda en otro sitio. También puedes escribir las coordenadas a mano y no usar la ubicación.</p><h4>5. Cámara</h4><p>La cámara se usa solo para medir distancias y para superponer las trayectorias del sol y la luna sobre la imagen en directo. La imagen se procesa en el dispositivo y no se guarda ni se transmite. Solo se guarda una foto cuando decides tomarla para incorporarla a un plano.</p><h4>6. iCloud</h4><p>Los planos (Draft) se guardan en tu propio iCloud Drive y se comparten entre dispositivos con la misma cuenta de Apple. Están en iCloud de Apple, no en un servidor del desarrollador, y el desarrollador no puede verlos. Puedes desactivar iCloud Drive para esta app en los ajustes del dispositivo.</p><h4>7. Fotos y PDF</h4><p>Las fotos o PDF que importas en Draft se guardan solo en tu dispositivo y nunca se suben.</p><h4>8. Enlaces externos</h4><p>Abrir un enlace de carta DMX o manual del fabricante te lleva a un sitio externo regido por la política de privacidad de esa empresa.</p><h4>9. Eliminación de datos</h4><p>Desinstalar la App o borrar sus datos elimina toda la información almacenada.</p><h4>10. Versión beta</h4><p>Esta App es una beta de TestFlight y deja de funcionar un periodo determinado (unas 3 semanas) tras el primer inicio.</p><h4>11. Menores</h4><p>La App no está dirigida a menores de 13 años.</p><h4>12. Cambios</h4><p>Esta política puede actualizarse. Los cambios importantes se anunciarán en la App.</p><h4>13. Sobre los valores calculados</h4><p>La iluminancia, el número f y los ángulos de haz que muestra la aplicación se calculan a partir de datos publicados por los fabricantes y de mediciones. En rodaje influyen la tensión de red, las horas de lámpara, la variación entre unidades, los reflejos y las condiciones atmosféricas, por lo que <b>los valores pueden diferir de una medición real</b>. Úsalos como orientación y decide midiendo en el set.</p><p>Para algunos equipos y accesorios no existen datos publicados y se usan valores derivados de condiciones comparables. Los ángulos que no se han podido verificar se muestran como «ángulo sin verificar».</p><p>El desarrollador no asume responsabilidad por las decisiones tomadas con estos valores.</p><h4>14. Contacto</h4><p>Preguntas sobre esta política: <a href=\"mailto:katohmanabu@icloud.com\">katohmanabu@icloud.com</a></p>"};
var TITLE   = { ja:'プライバシーポリシー', en:'Privacy Policy', es:'Política de privacidad' };
var CONTACT = { ja:'CALM — 撮影照明のための計算ツール', en:'CALM — a lighting tool for film and video', es:'CALM — herramienta de iluminación para cine y vídeo' };

function show(l) {
  if (!POLICY[l]) l = 'en';
  document.documentElement.lang = l;
  document.getElementById('body').innerHTML = '<h2 style="font-size:17px;margin:22px 0 0;">' + TITLE[l] + '</h2>' + POLICY[l];
  document.getElementById('contact').textContent = CONTACT[l];
  var b = document.querySelectorAll('nav button');
  for (var i = 0; i < b.length; i++) {
    b[i].setAttribute('aria-current', b[i].getAttribute('data-l') === l ? 'true' : 'false');
  }
  try { history.replaceState(null, '', '?lang=' + l); } catch (e) {}
}

var q = (location.search.match(/lang=([a-z]{2})/) || [])[1];
var nav0 = (navigator.language || 'en').slice(0, 2);
show(q || (POLICY[nav0] ? nav0 : 'en'));

var btns = document.querySelectorAll('nav button');
for (var i = 0; i < btns.length; i++) {
  btns[i].addEventListener('click', function () { show(this.getAttribute('data-l')); });
}
</script>
</body>
</html>
